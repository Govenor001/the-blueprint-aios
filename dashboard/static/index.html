<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIOS Mission Control</title>
  <style>
    :root { color-scheme: dark; --bg:#10131a; --panel:#181d27; --muted:#9aa5b5; --line:#2b3443; --accent:#76e0c2; }
    * { box-sizing:border-box; } body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:#f5f7fb; }
    main { max-width:1100px; margin:auto; padding:32px 20px 60px; } header { display:flex; justify-content:space-between; gap:16px; align-items:end; margin-bottom:24px; }
    h1,h2,p { margin:0; } h1 { font-size:clamp(28px,5vw,48px); letter-spacing:-.04em; } h2 { font-size:18px; }
    .subtle { color:var(--muted); } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:20px 0; }
    .card,.wing { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; } .card strong { display:block; font-size:28px; color:var(--accent); }
    .wing { margin-top:16px; } .wing > h2 { text-transform:capitalize; margin-bottom:12px; } .department { border-top:1px solid var(--line); padding:12px 0 0; margin-top:12px; }
    .agents { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; } button { border:1px solid var(--line); background:#222a37; color:#fff; padding:8px 10px; border-radius:8px; cursor:pointer; }
    button:hover { border-color:var(--accent); } #status { min-height:24px; } pre { white-space:pre-wrap; word-break:break-word; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <header><div><p class="subtle">AIOS</p><h1>Mission Control</h1><p class="subtle">Your operating system for the work that matters.</p></div><p id="status" class="subtle">Loading…</p></header>
    <section id="counts" class="grid" aria-label="Skill counts"></section>
    <section id="map" aria-label="Skill map"></section>
    <section id="panels" aria-label="Metrics panels"></section>
    <section class="card" style="margin-top:16px"><h2>Activity</h2><pre id="activity">No activity yet.</pre></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
