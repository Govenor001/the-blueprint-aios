name: AIOS checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dashboard/requirements.txt
          pip install pytest
      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m pytest -q -vv
      - name: Validate skills
        id: skills
        continue-on-error: true
        run: python scripts/validate_skills.py
      - name: Report failures
        if: steps.tests.outcome == 'failure' || steps.skills.outcome == 'failure'
        run: |
          python -m pytest -q -vv > pytest-report.txt 2>&1 || true
          tail -n 35 pytest-report.txt | tr '\n' ' ' | sed 's/%/%25/g' | sed 's/\r/%0D/g' | sed 's/$/%0A/g' | xargs -0 -r echo "::error title=AIOS verification::"
          if [ "${{ steps.skills.outcome }}" = "failure" ]; then
            echo "::error title=AIOS verification::Skill validation failed"
          fi
          exit 1
